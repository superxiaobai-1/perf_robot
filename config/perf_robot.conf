# All periodic collectors start at 10 Hz. Values remain configurable so the
# production profile can later reduce slow-changing metrics independently.
sample_hz=10
retention_seconds=60
capture_seconds=10
cooldown_seconds=5
auto_trigger_enabled=true
cpu_trigger_percent=95
memory_available_trigger_mb=512
thermal_trigger_celsius=95
trigger_consecutive_samples=10
min_free_disk_mb=512
# Comma-separated numeric PIDs. Use 0 to monitor perf_robot itself.
tracked_pids=0
incident_root=/tmp/perf_robot/incidents
pid_file=/tmp/perf_robot/perf_robot.pid
# Leading @ means Linux abstract Unix socket: no filesystem socket file.
control_socket=@perf_robot.control

# L2 burst collectors. Failures are recorded in burst/status.json and do not
# stop L0/L1 monitoring.
l2_lttng_enabled=true
l2_ebpf_enabled=true
ros_prefix=/opt/ros/jazzy
lttng_path=/usr/bin/lttng
lttng_no_sessiond=true
# Bounded non-blocking UST channel. lttng_target_pids falls back to the eBPF
# PID list when empty; if both are empty LTTng fails closed.
lttng_events=ros2:rcl_init,ros2:rcl_node_init,ros2:rcl_publisher_init,ros2:rcl_subscription_init,ros2:rclcpp_subscription_callback_added,ros2:rclcpp_callback_register,ros2:callback_start,ros2:callback_end,ros2:rclcpp_publish,ros2:rcl_publish,ros2:rmw_publish,ros2:rmw_take,ros2:rcl_take
lttng_target_pids=
lttng_subbuf_size_kb=256
lttng_num_subbuf=4
ebpf_runner_path=build/perf_robot_ebpf_runner
ebpf_object_path=build/perf_robot_sched.bpf.o
# Only events above these thresholds enter the userspace ring buffer.
ebpf_runqueue_threshold_us=1000
ebpf_offcpu_min_us=200000
ebpf_offcpu_max_us=5000000
ebpf_softirq_threshold_us=1000
ebpf_hardirq_threshold_us=1000
# L2 defaults to lightweight scheduling/off-CPU timing without stack walking.
# Enable stacks only for a short L3 capture. A rate of 16 captures roughly one
# in every 16 blocking switch-outs per CPU. Set to 1 for every event.
ebpf_user_stack_enabled=false
ebpf_kernel_stack_enabled=false
ebpf_stack_sample_rate=16
# IRQ hooks are system-wide and therefore opt-in.
ebpf_irq_enabled=false
# Refresh /proc/PID/task so threads created after Burst start are included.
ebpf_tid_refresh_seconds=2
# An L2 long off-CPU anomaly automatically arms sampled stack capture for
# that TID for a fixed 1-3 second window. A TID is armed only once per Burst.
ebpf_auto_deep_enabled=true
ebpf_auto_deep_seconds=2
ebpf_auto_deep_max_tids=2
ebpf_auto_deep_user_stack=true
ebpf_auto_deep_kernel_stack=false
# Scheduler/off-CPU process whitelist (Linux TGIDs). All threads belonging to
# each process are expanded into a TID whitelist. Explicit TIDs can be added for
# tighter scope. If both lists are empty, scheduler probes are not attached.
ebpf_target_pids=
ebpf_target_tids=
